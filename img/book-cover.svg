<svg xmlns="http://www.w3.org/2000/svg" width="440" height="250" viewBox="0 0 440 250">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#16213e;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#6c3ce0;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8b5cf6;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="440" height="250" fill="url(#bg)" rx="8"/>

  <!-- Accent line top -->
  <rect x="0" y="0" width="440" height="4" fill="url(#accent)" rx="2"/>

  <!-- Web + Mail icon group -->
  <g transform="translate(30, 35)">
    <!-- Browser window (web hosting) -->
    <rect x="10" y="3" width="84" height="50" rx="5" fill="none" stroke="#8b5cf6" stroke-width="2"/>
    <line x1="10" y1="15" x2="94" y2="15" stroke="#8b5cf6" stroke-width="2" opacity="0.7"/>
    <circle cx="17" cy="9" r="1.8" fill="#a78bfa" opacity="0.9"/>
    <circle cx="24" cy="9" r="1.8" fill="#6c3ce0" opacity="0.9"/>
    <circle cx="31" cy="9" r="1.8" fill="#4a5568" opacity="0.7"/>
    <!-- Globe inside the window -->
    <circle cx="52" cy="34" r="13" fill="none" stroke="#a78bfa" stroke-width="1.8" opacity="0.9"/>
    <ellipse cx="52" cy="34" rx="5.5" ry="13" fill="none" stroke="#a78bfa" stroke-width="1.4" opacity="0.7"/>
    <line x1="39" y1="34" x2="65" y2="34" stroke="#a78bfa" stroke-width="1.4" opacity="0.7"/>
    <line x1="41" y1="27" x2="63" y2="27" stroke="#a78bfa" stroke-width="1.2" opacity="0.5"/>
    <line x1="41" y1="41" x2="63" y2="41" stroke="#a78bfa" stroke-width="1.2" opacity="0.5"/>

    <!-- Envelope (email hosting) -->
    <rect x="10" y="62" width="84" height="34" rx="5" fill="none" stroke="#8b5cf6" stroke-width="2"/>
    <path d="M12,66 L52,84 L92,66" fill="none" stroke="#6c3ce0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" opacity="0.85"/>
  </g>

  <!-- Lock icon (auto-SSL / security) -->
  <g transform="translate(118, 84)">
    <rect x="2" y="13" width="26" height="20" rx="3" fill="none" stroke="#6c3ce0" stroke-width="2" opacity="0.7"/>
    <path d="M8,13 L8,8 A7,7 0 0 1 22,8 L22,13" fill="none" stroke="#8b5cf6" stroke-width="2" opacity="0.7"/>
    <circle cx="15" cy="22" r="2.4" fill="#a78bfa"/>
    <rect x="14" y="23" width="2" height="6" rx="1" fill="#a78bfa"/>
  </g>

  <!-- Module title -->
  <text x="220" y="52" font-family="Arial, sans-serif" font-size="26" font-weight="bold" fill="white" text-anchor="start">Web + Mail</text>
  <text x="220" y="84" font-family="Arial, sans-serif" font-size="26" font-weight="bold" fill="white" text-anchor="start">Hosting</text>

  <!-- Subtitle -->
  <text x="220" y="111" font-family="Arial, sans-serif" font-size="13" fill="#94a3b8" text-anchor="start">WHMCS Server Module</text>

  <!-- Divider -->
  <rect x="220" y="124" width="60" height="2" fill="#6c3ce0" rx="1"/>

  <!-- Description -->
  <text x="220" y="148" font-family="Arial, sans-serif" font-size="11" fill="#64748b" text-anchor="start">HestiaCP web &amp; email hosting</text>
  <text x="220" y="164" font-family="Arial, sans-serif" font-size="11" fill="#64748b" text-anchor="start">with server segmentation,</text>
  <text x="220" y="180" font-family="Arial, sans-serif" font-size="11" fill="#64748b" text-anchor="start">auto-SSL, DNS &amp; Vanity mode</text>

  <!-- PUQ Cloud branding -->
  <g transform="translate(30, 210)">
    <text x="0" y="15" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="#6c3ce0">PUQ</text>
    <text x="55" y="15" font-family="Arial, sans-serif" font-size="12" fill="#64748b">cloud</text>
  </g>

  <!-- Version badge -->
  <g transform="translate(362, 218)">
    <rect x="0" y="0" width="55" height="20" rx="4" fill="#6c3ce0" opacity="0.2" stroke="#6c3ce0" stroke-width="1"/>
    <text x="27" y="14" font-family="Arial, sans-serif" font-size="11" fill="#a78bfa" text-anchor="middle">v1.0</text>
  </g>
</svg>
